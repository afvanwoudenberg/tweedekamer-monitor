    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [persoon_id]
        expression: silver.persoon (id)
    columns:
      - name: id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van een PersoonNevenfunctie.
        data_tests:
          - unique
          - not_null
      - name: persoon_id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van de bijbehorende Persoon.
        data_tests:
          - relationships:
              arguments:
                to: ref('persoon')
                field: id
      - name: omschrijving
        data_type: VARCHAR
        description: Omschrijving van een PersoonNevenfunctie.
      - name: is_actief
        data_type: BOOLEAN
        description: Geeft aan of een PersoonNevenfunctie momenteel wordt bekleed.
      - name: periode_van
        data_type: DATE
        description: >
          Startdatum van een PersoonNevenfunctie. Bij een gedeeltelijke bronwaarde
          zijn ontbrekende onderdelen op 1 gezet; zie periode_van_precisie.
      - name: periode_van_ruw
        data_type: VARCHAR
        description: Oorspronkelijke brontekst van de startdatum.
      - name: periode_van_precisie
        data_type: VARCHAR
        description: Nauwkeurigheid van de startdatum.
        data_tests:
          - accepted_values:
              arguments:
                values: ["dag", "maand", "jaar", "week", "week_dag"]
      - name: periode_tot_en_met
        data_type: DATE
        description: >
          Einddatum van een PersoonNevenfunctie. Bij een gedeeltelijke bronwaarde
          zijn ontbrekende maand/dag ingevuld met de laatste dag van de maand of
          31 december; zie periode_tot_en_met_precisie.
      - name: periode_tot_en_met_ruw
        data_type: VARCHAR
        description: Oorspronkelijke brontekst van de einddatum.
      - name: periode_tot_en_met_precisie
        data_type: VARCHAR
        description: Nauwkeurigheid van de einddatum.
        data_tests:
          - accepted_values:
              arguments:
                values: ["dag", "maand", "jaar", "week", "week_dag"]
      - name: vergoeding_soort
        data_type: VARCHAR
        description: Soort vergoeding voor een PersoonNevenfunctie.
      - name: vergoeding_toelichting
        data_type: VARCHAR
        description: Toelichting op de soort vergoeding voor een PersoonNevenfunctie.
      - name: gewicht
        data_type: INTEGER
        description: Waarde om de positie van een PersoonNevenfunctie in een lijst te bepalen.
      - name: gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: >
          Datum en tijd waarop het bronsysteem een PersoonNevenfunctie heeft
          aangemaakt of aangepast.
        data_tests:
          - not_null
      - name: api_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: >
          Datum en tijd waarop de toevoeging of laatste wijziging van een
          PersoonNevenfunctie zichtbaar is geworden in het Gegevensmagazijn.
        data_tests:
          - not_null

  - name: persoon_nevenfunctie_inkomsten
    description: >
      Actuele, ontdubbelde inkomsten behorende bij PersoonNevenfuncties. Alleen
      inkomsten waarvan de bijbehorende PersoonNevenfunctie in de silverlaag
      aanwezig is worden opgenomen; verwijderde of verweesde records worden
      uitgesloten.
    constraints:
      - type: primary_key
        columns: [id]
      - type: foreign_key
        columns: [persoon_nevenfunctie_id]
        expression: silver.persoon_nevenfunctie (id)
    columns:
      - name: id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van een PersoonNevenfunctieInkomsten.
        data_tests:
          - unique
          - not_null
      - name: persoon_nevenfunctie_id
        data_type: VARCHAR
        description: Uniek identificatienummer (GUID) van de bijbehorende PersoonNevenfunctie.
        data_tests:
          - relationships:
              arguments:
                to: ref('persoon_nevenfunctie')
                field: id
      - name: jaar
        data_type: INTEGER
        description: Jaar van een PersoonNevenfunctieInkomsten.
      - name: bedrag_soort
        data_type: VARCHAR
        description: Soort bedrag, bijvoorbeeld Bruto, Netto of Onbekend.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Bruto", "Netto", "Onbekend"]
      - name: bedrag_voorvoegsel
        data_type: VARCHAR
        description: Voorvoegsel van het bedrag.
      - name: bedrag_valuta
        data_type: VARCHAR
        description: Valuta van het bedrag.
      - name: bedrag
        data_type: DECIMAL(18,2)
        description: Bedrag behorende bij een PersoonNevenfunctieInkomsten.
      - name: bedrag_achtervoegsel
        data_type: VARCHAR
        description: Achtervoegsel van het bedrag.
      - name: frequentie
        data_type: VARCHAR
        description: Frequentie van de inkomsten.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Eenmalig", "Per dag", "Per jaar", "Per maand", "Vrije invoer"]
      - name: frequentie_beschrijving
        data_type: VARCHAR
        description: Notitie gemaakt bij de frequentie van de inkomsten.
      - name: opmerking
        data_type: VARCHAR
        description: Notitie gemaakt bij de inkomsten.
      - name: gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: >
          Datum en tijd waarop het bronsysteem een PersoonNevenfunctieInkomsten
          heeft aangemaakt of aangepast.
        data_tests:
          - not_null
      - name: api_gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: >
          Datum en tijd waarop de toevoeging of laatste wijziging van inkomsten
          zichtbaar is geworden in het Gegevensmagazijn.
        data_tests:
          - not_null

