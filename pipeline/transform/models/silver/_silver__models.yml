      - name: van_ruw
        data_type: VARCHAR
        description: Oorspronkelijke brontekst van de begindatum.
      - name: van_precisie
        data_type: VARCHAR
        description: Nauwkeurigheid van de begindatum.
        data_tests:
          - accepted_values:
              arguments:
                values: ["dag", "maand", "jaar", "week", "week_dag"]
      - name: tot_en_met
        data_type: DATE
        description: >
          Einddatum van een PersoonReis. Bij een gedeeltelijke bronwaarde zijn
          ontbrekende maand/dag ingevuld met de laatste dag van de maand of
          31 december; zie tot_en_met_precisie.
