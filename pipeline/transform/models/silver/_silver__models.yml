      - name: tot_en_met_ruw
        data_type: VARCHAR
        description: Oorspronkelijke brontekst van de einddatum.
      - name: tot_en_met_precisie
        data_type: VARCHAR
        description: Nauwkeurigheid van de einddatum.
        data_tests:
          - accepted_values:
              arguments:
                values: ["dag", "maand", "jaar", "week", "week_dag"]
      - name: gewicht
        data_type: INTEGER
        description: Waarde om de positie van een PersoonOnderwijs in een lijst te bepalen.
      - name: gewijzigd_op
        data_type: TIMESTAMP WITH TIME ZONE
        description: >
          Datum en tijd waarop het bronsysteem een PersoonOnderwijs heeft
